schema_version: 1

context:
  name: sqlparse
  version: "0.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sqlparse-${{ version }}.tar.gz
  sha256: 113c35c75365ab9cc9c7231d68c6428fb11c085fc8e9eb1ad659b7ddbf6cd2b9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - sqlformat = sqlparse.__main__:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sqlparse
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - sqlformat --help

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A non-validating SQL parser module for Python.
  description: |
    sqlparse is a non-validating SQL parser for Python. It provides support
    for parsing, splitting and formatting SQL statements.
  homepage: https://github.com/andialbrecht/sqlparse
  repository: https://github.com/andialbrecht/sqlparse
  documentation: https://sqlparse.readthedocs.org

extra:
  recipe-maintainers:
    - ocefpaf
    - thewchan
